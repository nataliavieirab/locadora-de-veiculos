<main class="mx-auto flex min-h-screen max-w-2xl flex-col gap-6 px-4 py-10">
  <header class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-stone-950">Sua empresa</h1>
      <p class="text-stone-700">A sessão vale só nesta aba.</p>
    </div>
    <button type="button" class="inline-flex items-center gap-2 rounded-md border border-stone-700 px-3 py-2" (click)="sair()">
      <svg lucideLogOut [size]="18" aria-hidden="true"></svg>
      Sair
    </button>
  </header>

  <section class="rounded-md border border-stone-400 bg-white p-4" aria-labelledby="titulo-empresa">
    <h2 id="titulo-empresa" class="font-medium text-stone-950">Identificação</h2>
    <p class="mt-2 text-stone-800">Empresa</p>
    <p id="empresa" class="font-mono text-stone-950">{{ memoria.empresaId() }}</p>
    <p class="mt-2 text-stone-800">Conta</p>
    <p id="conta" class="font-mono text-stone-950">{{ memoria.contaId() }}</p>
  </section>
  <nav aria-label="Cadastros">
    <a routerLink="/grupos-planos" class="inline-flex rounded-lg bg-blue-900 px-5 py-3 font-semibold text-white">Grupos e planos</a>
    <a routerLink="/veiculos" class="ml-3 inline-flex rounded-lg bg-blue-900 px-5 py-3 font-semibold text-white">Veículos</a>
    <a routerLink="/clientes" class="ml-3 inline-flex rounded-lg bg-blue-900 px-5 py-3 font-semibold text-white">Clientes e condutores</a>
    <a routerLink="/precos-servicos" class="ml-3 inline-flex rounded-lg bg-blue-900 px-5 py-3 font-semibold text-white">Preços e serviços</a>
  </nav>
</main>
